name: Update contribution motion

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-motion
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate animated contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-activity.py --output assets/contribution-signal.svg
      - name: Commit only if changed
        run: |
          git add assets/contribution-signal.svg
          if git diff --cached --quiet; then
            echo 'No changes to contribution data.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update contribution visualization'
          git push

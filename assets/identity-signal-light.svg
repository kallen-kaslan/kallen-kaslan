<svg xmlns="http://www.w3.org/2000/svg" width="960" height="32" viewBox="0 0 960 32" aria-hidden="true"><defs><linearGradient id="beam"><stop stop-color="#5270c4" stop-opacity="0"/><stop offset=".5" stop-color="#7963bb"/><stop offset="1" stop-color="#5270c4" stop-opacity="0"/></linearGradient><clipPath id="track"><rect x="0" y="0" width="960" height="32"/></clipPath></defs><style>.beam{animation:scan 5s linear infinite}.node{animation:node 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.n2{animation-delay:-1.6s}.n3{animation-delay:-3.2s}@keyframes scan{0%{transform:translateX(-160px)}100%{transform:translateX(960px)}}@keyframes node{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.45)}}@media(prefers-reduced-motion:reduce){.beam{display:none}.node{animation:none}}</style><g clip-path="url(#track)"><path d="M0 16H960" stroke="#7482aa" stroke-opacity=".40"/><path d="M0 16H130 M830 16H960" stroke="#5270c4" stroke-opacity=".7"/><rect class="beam" x="0" y="14.5" width="160" height="3" rx="1.5" fill="url(#beam)"/><g fill="#6c56ac"><circle class="node" cx="240" cy="16" r="2.5"/><circle class="node n2" cx="480" cy="16" r="2.5"/><circle class="node n3" cx="720" cy="16" r="2.5"/></g></g></svg>

 <svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 240">

  <defs>
    <linearGradient id="gradient">
      <stop offset="0%" stop-color="#31D7FF"/>
      <stop offset="100%" stop-color="#9580FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240"
        rx="12" fill="#0D1117"/>

  <text x="40" y="47"
        font-size="11"
        letter-spacing="3"
        font-family="monospace"
        fill="#8B949E">
    DIGITAL IDENTITY / 001
  </text>

  <text x="40" y="118"
        font-size="61"
        font-weight="bold"
        font-family="sans-serif"
        fill="#E6EDF3">
    KALLEN.
  </text>

  <text x="44" y="151"
        font-size="14"
        letter-spacing="2"
        font-family="monospace"
        fill="#31D7FF">
    CODE / DESIGN / MOTION
  </text>

  <g transform="translate(625 120)">

    <g fill="none"
       stroke="url(#gradient)"
       stroke-width="1.5">

      <ellipse rx="83" ry="32"/>
      <ellipse rx="83" ry="32" transform="rotate(30)"/>
      <ellipse rx="83" ry="32" transform="rotate(60)"/>
      <ellipse rx="83" ry="32" transform="rotate(90)"/>
      <ellipse rx="83" ry="32" transform="rotate(120)"/>
      <ellipse rx="83" ry="32" transform="rotate(150)"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="12s"
        repeatCount="indefinite"/>

    </g>

    <circle r="99"
            fill="none"
            stroke="#52647A"
            stroke-dasharray="2 8"/>

    <circle r="4" cx="99" fill="#31D7FF">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>

  </g>

  <rect x="44" y="181"
        width="90" height="3"
        rx="1.5"
        fill="url(#gradient)">

    <animate
      attributeName="width"
      values="40;180;40"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>

  <text x="44" y="211"
        font-family="monospace"
        font-size="10"
        fill="#8B949E">
    MOTION EXPERIMENT / 01
  </text>

</svg>
